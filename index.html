<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D-Preview</title>
  <!-- Three.js r147 (Last classic global release with fflate 3MF support) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/STLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/3MFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/FBXLoader.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
    header { background: #1e293b; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; z-index: 10; gap: 8px; }
    h1 { font-size: 16px; font-weight: 600; color: #38bdf8; }
    .actions { display: flex; gap: 8px; }
    .btn { background: #0284c7; color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; }
    .btn-sec { background: #334155; }
    .btn:active { opacity: 0.85; }
    #viewer { flex: 1; width: 100%; position: relative; touch-action: none; }
    #stats { position: absolute; bottom: 16px; left: 16px; right: 16px; max-width: 380px; background: rgba(15, 23, 42, 0.9); padding: 10px 14px; border-radius: 8px; border: 1px solid #334155; font-size: 13px; line-height: 1.5; pointer-events: none; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>3D-Preview</h1>
    <div class="actions">
      <button class="btn btn-sec" id="resetBtn">Reset View</button>
      <label class="btn">
        Import 3D File
        <input type="file" id="fileInput" accept=".3mf,.stl,.obj,.glb,.gltf,.fbx" />
      </label>
    </div>
  </header>
  <div id="viewer">
    <div id="stats">Supports .3MF, .STL, .OBJ, .GLB, .GLTF, .FBX<br><span style="color:#94a3b8;font-size:11px;">(Export Blender .blend files as .GLB or .STL)</span></div>
  </div>

  <script>
    const container = document.getElementById('viewer');
    const stats = document.getElementById('stats');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 10000);
    camera.position.set(150, 150, 150);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight1.position.set(150, 250, 150);
    scene.add(dirLight1);
    const dirLight2 = new THREE.DirectionalLight(0x38bdf8, 0.35);
    dirLight2.position.set(-150, -100, -150);
    scene.add(dirLight2);

    const grid = new THREE.GridHelper(245, 24, 0x38bdf8, 0x1e293b);
    scene.add(grid);

    let currentModel = null;
    let lastCameraPos = new THREE.Vector3(150, 150, 150);
    let lastTarget = new THREE.Vector3(0, 0, 0);

    const defaultMat = new THREE.MeshStandardMaterial({
      color: 0x38bdf8,
      roughness: 0.45,
      metalness: 0.1,
      side: THREE.DoubleSide
    });

    function fitAndMeasure(object, fileName) {
      if (currentModel) scene.remove(currentModel);
      currentModel = object;

      let meshCount = 0;
      let triCount = 0;

      object.traverse((child) => {
        if (child.isMesh) {
          meshCount++;
          if (child.geometry) {
            child.geometry.computeVertexNormals();
            const pos = child.geometry.attributes.position;
            if (pos) triCount += Math.round(pos.count / 3);
          }
          if (!child.material) {
            child.material = defaultMat;
          } else {
            child.material.side = THREE.DoubleSide;
          }
        }
      });

      if (meshCount === 0) {
        stats.innerHTML = `<span style="color:#f87171;"><strong>No 3D mesh found in ${fileName}.</strong><br>If sliced in Anycubic/Orca/Bambu, export as <b>Generic .3MF</b> or <b>.STL</b> instead of Project .3MF.</span>`;
        return;
      }

      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      object.position.x -= center.x;
      object.position.z -= center.z;
      object.position.y -= box.min.y;
      scene.add(object);

      const maxDim = Math.max(size.x, size.y, size.z) || 50;
      camera.near = Math.max(0.01, maxDim / 500);
      camera.far = Math.max(5000, maxDim * 50);
      camera.updateProjectionMatrix();

      lastCameraPos.set(maxDim * 1.6, maxDim * 1.3, maxDim * 1.6);
      lastTarget.set(0, size.y / 2, 0);

      camera.position.copy(lastCameraPos);
      controls.target.copy(lastTarget);
      controls.update();

      stats.innerHTML = `<strong>${fileName}</strong> (${meshCount} mesh, ${triCount.toLocaleString()} tris)<br>X: ${size.x.toFixed(1)} | Y: ${size.z.toFixed(1)} | Z: ${size.y.toFixed(1)} mm`;
    }

    document.getElementById('resetBtn').addEventListener('click', () => {
      camera.position.copy(lastCameraPos);
      controls.target.copy(lastTarget);
      controls.update();
    });

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      stats.textContent = 'Parsing ' + file.name + '...';

      setTimeout(() => {
        const reader = new FileReader();
        const ext = file.name.split('.').pop().toLowerCase();

        reader.onload = (event) => {
          try {
            const data = event.target.result;
            if (ext === 'stl') {
              const geom = new THREE.STLLoader().parse(data);
              fitAndMeasure(new THREE.Mesh(geom, defaultMat), file.name);
            } else if (ext === '3mf') {
              const group = new THREE.ThreeMFLoader().parse(data);
              fitAndMeasure(group, file.name);
            } else if (ext === 'obj') {
              const text = new TextDecoder().decode(data);
              const group = new THREE.OBJLoader().parse(text);
              fitAndMeasure(group, file.name);
            } else if (ext === 'glb' || ext === 'gltf') {
              new THREE.GLTFLoader().parse(data, '', (gltf) => {
                fitAndMeasure(gltf.scene, file.name);
              }, (err) => {
                stats.innerHTML = `<span style="color:#f87171;">GLTF Error: ${err.message}</span>`;
              });
            } else if (ext === 'fbx') {
              const group = new THREE.FBXLoader().parse(data, '');
              fitAndMeasure(group, file.name);
            } else {
              stats.textContent = 'Unsupported format: .' + ext;
            }
          } catch (err) {
            stats.innerHTML = `<span style="color:#f87171;">Parse Error: ${err.message}</span>`;
          }
        };
        reader.readAsArrayBuffer(file);
      }, 50);
    });

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
