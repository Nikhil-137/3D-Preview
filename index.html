<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Model Preview</title>
<style>
  :root {
    --bg: #1b1f24;
    --panel: #252b32;
    --line: #3a424c;
    --text: #e8ecf0;
    --muted: #97a1ad;
    --accent: #4fb3ff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eef1f4;
      --panel: #ffffff;
      --line: #cfd6de;
      --text: #1d242c;
      --muted: #5d6874;
      --accent: #0a6fc2;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 650; }
  button, label.btn {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 12px;
    font: inherit;
    cursor: pointer;
  }
  button:hover, label.btn:hover { border-color: var(--accent); }
  button:focus-visible, label.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  label.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  input[type="file"] { position: absolute; opacity: 0; width: 1px; height: 1px; }
  input[type="color"] {
    width: 34px; height: 34px; padding: 2px;
    border: 1px solid var(--line); border-radius: 6px; background: transparent; cursor: pointer;
  }
  #info { margin-left: auto; color: var(--muted); font-size: 13px; }
  main { position: relative; flex: 1; min-height: 0; }
  #stage { position: absolute; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #drop {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; text-align: center; padding: 24px;
    pointer-events: none;
  }
  #drop strong { font-size: 20px; }
  #drop span { color: var(--muted); }
  main.dragging { outline: 3px dashed var(--accent); outline-offset: -12px; }
  .panel {
    position: absolute; top: 10px; right: 10px;
    width: min(330px, calc(100% - 20px));
    max-height: calc(100% - 20px); overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; display: none; z-index: 5;
  }
  .panel.open { display: block; }
  .panel h2 { font-size: 13px; font-weight: 650; margin: 12px 0 6px; color: var(--muted); }
  .panel h2:first-child { margin-top: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .row button { padding: 6px 10px; font-size: 14px; }
  .panel input[type="range"] { width: 100%; accent-color: var(--accent); }
  #msg {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 14px; display: none; max-width: 90%;
  }
  #msg.show { display: block; }
</style>
</head>
<body>

<header>
  <h1>3D model preview</h1>
  <label class="btn primary">Open file
    <input type="file" id="file" accept=".stl,.3mf">
  </label>
  <button id="reset" type="button">Reset view</button>
  <button id="wire" type="button" aria-pressed="false">Wireframe</button>
  <button id="grid" type="button" aria-pressed="true">Grid</button>
  <button id="rotate" type="button" aria-pressed="false">Auto-rotate</button>
  <button id="lights" type="button" aria-pressed="false">Lights</button>
  <input type="color" id="color" value="#4fb3ff" aria-label="Model color" title="Model color">
  <div id="info"></div>
</header>

<main id="dropzone">
  <div id="stage"></div>
  <div id="drop">
    <strong>Drop an STL or 3MF file here</strong>
    <span>or use Open file. Files stay on your device.</span>
  </div>
  <div id="panel" class="panel" aria-label="Lighting and look">
    <h2>Lights</h2>
    <div class="row" id="lightBtns">
      <button type="button" data-light="head">Front</button>
      <button type="button" data-light="left">Left</button>
      <button type="button" data-light="right">Right</button>
      <button type="button" data-light="top">Top</button>
      <button type="button" data-light="bottom">Bottom</button>
      <button type="button" data-light="back">Back</button>
      <button type="button" data-light="ambient">Soft fill</button>
    </div>
    <h2>Brightness</h2>
    <input type="range" id="bright" min="0.2" max="3" step="0.1" value="1.2" aria-label="Brightness">
    <h2>Shading</h2>
    <div class="row" id="shadeBtns">
      <button type="button" data-shade="solid">Solid</button>
      <button type="button" data-shade="flat">Flat</button>
      <button type="button" data-shade="normals">Normals</button>
    </div>
    <h2>Performance</h2>
    <div class="row" id="perfBtns">
      <button type="button" data-opt="twoSided">Both sides</button>
      <button type="button" data-opt="wireMoving">Wireframe while moving</button>
    </div>
    <h2>Background</h2>
    <div class="row" id="bgBtns">
      <button type="button" data-bg="dark">Dark</button>
      <button type="button" data-bg="gray">Gray</button>
      <button type="button" data-bg="light">Light</button>
    </div>
  </div>
  <div id="msg" role="status"></div>
</main>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { ThreeMFLoader } from 'three/addons/loaders/3MFLoader.js';

const stage = document.getElementById('stage');
const dropzone = document.getElementById('dropzone');
const dropHint = document.getElementById('drop');
const info = document.getElementById('info');
const msg = document.getElementById('msg');
const colorInput = document.getElementById('color');

// ---- Scene setup ----
const FULL_PR = Math.min(window.devicePixelRatio, 2);   // sharp, when the view is still
const MOVE_PR = 1;                                      // cheaper, while moving
const renderer = new THREE.WebGLRenderer({ antialias: window.devicePixelRatio < 2 });
renderer.setPixelRatio(FULL_PR);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 10000);
camera.position.set(120, 100, 120);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotateSpeed = 2;

const BGS = { dark: 0x1b1f24, gray: 0x7a828c, light: 0xeef1f4 };
scene.background = new THREE.Color(BGS.dark);

// Lights live on a rig that follows the camera's orientation,
// so "Left" always means left of what you are looking at.
const hemi = new THREE.HemisphereLight(0xffffff, 0x445566, 0);
scene.add(hemi);
const rig = new THREE.Group();
scene.add(rig);
const LIGHT_DIRS = {
  head: [0, 0.25, 1], left: [-1, 0.35, 0.4], right: [1, 0.35, 0.4],
  top: [0, 1, 0.2], bottom: [0, -1, 0.25], back: [0, 0.3, -1]
};
const lights = {};
for (const [name, v] of Object.entries(LIGHT_DIRS)) {
  const l = new THREE.DirectionalLight(0xffffff, 0);
  l.position.set(v[0], v[1], v[2]).multiplyScalar(10);
  rig.add(l);
  rig.add(l.target);          // target stays at the rig centre (the model)
  lights[name] = l;
}
const lightOn = { head: true, left: true, right: false, top: true, bottom: false, back: false, ambient: true };
const ORDER = ['head', 'left', 'top', 'right', 'back', 'bottom'];
let brightness = 1.2;
let shade = 'solid';
let twoSided = false;       // one-sided drawing is about twice as fast for closed models
let wireMoving = false;     // keep wireframe while moving (slow on big models)
let interacting = false;

// Low quality while the view is moving: fewer lights, lower resolution, no heavy wireframe
function lowQuality() { return interacting || controls.autoRotate; }

function updateLights() {
  const active = ORDER.filter(k => lightOn[k]);
  const used = lowQuality() ? active.slice(0, 2) : active;
  const gain = used.length ? active.length / used.length : 0;   // keeps overall brightness similar
  for (const k of ORDER) {
    lights[k].visible = used.includes(k);     // hidden lights cost nothing
    lights[k].intensity = 1.5 * brightness * gain;
  }
  hemi.visible = lightOn.ambient;
  hemi.intensity = 0.45 * brightness;
}
updateLights();

let dirty = true;
let gridHelper = null;
let current = null;         // THREE.Object3D currently shown
let wireframe = false;
let modelColor = new THREE.Color(colorInput.value);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  invalidate();
}
new ResizeObserver(resize).observe(stage);
resize();

// Draw only when something changed (saves battery and heat when the model is idle)
function invalidate() { dirty = true; }
function loop() {
  requestAnimationFrame(loop);
  const moved = controls.update();
  if (!moved && !dirty) return;
  dirty = false;
  rig.position.copy(controls.target);
  rig.quaternion.copy(camera.quaternion);
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

let lastLow = false;
function refreshQuality() {
  const low = lowQuality();
  if (low !== lastLow) {
    lastLow = low;
    renderer.setPixelRatio(low ? MOVE_PR : FULL_PR);
  }
  updateLights();
  applyLook();
}
let calmTimer = 0;
controls.addEventListener('start', () => {
  clearTimeout(calmTimer);
  if (!interacting) { interacting = true; refreshQuality(); }
});
controls.addEventListener('end', () => {
  clearTimeout(calmTimer);
  calmTimer = setTimeout(() => { interacting = false; refreshQuality(); }, 250);
});

// ---- Helpers ----
function showMsg(text, ms = 4000) {
  msg.textContent = text;
  msg.classList.add('show');
  clearTimeout(showMsg.t);
  showMsg.t = setTimeout(() => msg.classList.remove('show'), ms);
}

function forEachMat(mat, fn) { (Array.isArray(mat) ? mat : [mat]).forEach(fn); }

// Builds the Solid / Flat / Normals variants of a mesh's material once, then switches between them.
function prepare(o) {
  const u = o.userData;
  if (u.mats) return u.mats;
  const base = o.material;
  const flat = Array.isArray(base) ? base.map(m => m.clone()) : base.clone();
  forEachMat(flat, m => { m.flatShading = true; m.needsUpdate = true; });
  u.mats = { solid: base, flat, normals: new THREE.MeshNormalMaterial({ side: THREE.DoubleSide }) };
  return u.mats;
}

function applyLook() {
  if (!current) return;
  const wire = wireframe && (!lowQuality() || wireMoving);
  const side = twoSided ? THREE.DoubleSide : THREE.FrontSide;
  current.traverse(o => {
    if (!o.isMesh) return;
    const mats = prepare(o);
    o.material = mats[shade];
    forEachMat(o.material, m => {
      if (m.side !== side) { m.side = side; m.needsUpdate = true; }
      m.wireframe = wire;
    });
  });
  invalidate();
}

function disposeObject(obj) {
  obj.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) forEachMat(o.material, m => m.dispose());
    if (o.userData.mats) Object.values(o.userData.mats).forEach(mm => forEachMat(mm, m => m.dispose()));
  });
}

function makeMaterial() {
  return new THREE.MeshStandardMaterial({
    color: modelColor, roughness: 0.55, metalness: 0.1,
    side: THREE.DoubleSide, wireframe
  });
}

function frameModel(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  // Center horizontally and rest the model on the grid (Z-up files become Y-up)
  obj.position.x -= center.x;
  obj.position.z -= center.z;
  obj.position.y -= box.min.y;

  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const dist = maxDim * 2.2;
  camera.position.set(dist * 0.8, dist * 0.7, dist * 0.8);
  controls.target.set(0, size.y / 2, 0);
  camera.near = maxDim / 100;
  camera.far = maxDim * 100;
  camera.updateProjectionMatrix();
  controls.update();
  invalidate();

  if (gridHelper) { scene.remove(gridHelper); gridHelper.geometry.dispose(); }
  const gridSize = Math.ceil(maxDim * 2 / 10) * 10;
  gridHelper = new THREE.GridHelper(gridSize, 20, 0x6b7785, 0x3a424c);
  gridHelper.visible = document.getElementById('grid').getAttribute('aria-pressed') === 'true';
  scene.add(gridHelper);

  return size;
}

function show(obj, name, triangles) {
  if (current) { scene.remove(current); disposeObject(current); }
  current = obj;
  scene.add(obj);
  // Models are usually Z-up (CAD/slicers); rotate to Three's Y-up
  const wrapper = new THREE.Group();
  scene.remove(obj);
  obj.rotation.x = -Math.PI / 2;
  wrapper.add(obj);
  scene.add(wrapper);
  current = wrapper;

  const size = frameModel(wrapper);
  applyLook();
  dropHint.style.display = 'none';
  const fmt = n => (Math.round(n * 100) / 100).toString();
  // Because of the Z-up rotation: width = x, depth = z, height = y
  info.textContent = `${name} · ${fmt(size.x)} × ${fmt(size.z)} × ${fmt(size.y)} · ${triangles.toLocaleString()} triangles`;
}

// ---- Loading ----
function countTriangles(obj) {
  let n = 0;
  obj.traverse(o => {
    if (o.isMesh && o.geometry) {
      const g = o.geometry;
      n += (g.index ? g.index.count : g.attributes.position.count) / 3;
    }
  });
  return Math.round(n);
}

function loadFile(file) {
  if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext !== 'stl' && ext !== '3mf') {
    showMsg('Unsupported file. Choose an .stl or .3mf file.');
    return;
  }
  const reader = new FileReader();
  reader.onerror = () => showMsg('Could not read that file.');
  reader.onload = () => {
    try {
      if (ext === 'stl') {
        const geometry = new STLLoader().parse(reader.result);
        geometry.computeVertexNormals();
        const mesh = new THREE.Mesh(geometry, makeMaterial());
        mesh.userData.tint = true;
        show(mesh, file.name, countTriangles(mesh));
      } else {
        const group = new ThreeMFLoader().parse(reader.result);
        // 3MF can carry its own colors; apply our material only to meshes without one
        group.traverse(o => {
          if (o.isMesh) {
            const hasColor = o.material && (o.material.vertexColors || (o.material.color && o.material.color.getHex() !== 0xffffff));
            if (!hasColor) { o.material = makeMaterial(); o.userData.tint = true; }
            else forEachMat(o.material, m => { m.side = THREE.DoubleSide; });
          }
        });
        show(group, file.name, countTriangles(group));
      }
    } catch (err) {
      console.error(err);
      showMsg('That file could not be parsed. It may be corrupted.');
    }
  };
  reader.readAsArrayBuffer(file);
}

// Optional: load a file from your repo with ?model=models/part.stl
const param = new URLSearchParams(location.search).get('model');
if (param) {
  fetch(param)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); })
    .then(b => loadFile(new File([b], param.split('/').pop())))
    .catch(() => showMsg('Could not load ' + param));
}

// ---- UI wiring ----
document.getElementById('file').addEventListener('change', e => loadFile(e.target.files[0]));

['dragenter', 'dragover'].forEach(t => dropzone.addEventListener(t, e => {
  e.preventDefault(); dropzone.classList.add('dragging');
}));
['dragleave', 'drop'].forEach(t => dropzone.addEventListener(t, e => {
  e.preventDefault(); dropzone.classList.remove('dragging');
}));
dropzone.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));

document.getElementById('reset').addEventListener('click', () => { if (current) frameResetView(); });
function frameResetView() {
  const box = new THREE.Box3().setFromObject(current);
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const dist = maxDim * 2.2;
  camera.position.set(dist * 0.8, dist * 0.7, dist * 0.8);
  controls.target.set(0, size.y / 2, 0);
  controls.update();
  invalidate();
}

function toggle(id, fn) {
  const b = document.getElementById(id);
  b.addEventListener('click', () => {
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on);
    fn(on);
  });
}
toggle('wire', on => {
  wireframe = on;
  applyLook();
});
toggle('grid', on => { if (gridHelper) gridHelper.visible = on; invalidate(); });
toggle('rotate', on => { controls.autoRotate = on; refreshQuality(); });

colorInput.addEventListener('input', () => {
  modelColor.set(colorInput.value);
  if (current) current.traverse(o => {
    if (!o.isMesh || !o.userData.tint) return;
    const mats = prepare(o);
    forEachMat(mats.solid, m => m.color.copy(modelColor));
    forEachMat(mats.flat, m => m.color.copy(modelColor));
  });
  invalidate();
});

// ---- Lights panel ----
const panel = document.getElementById('panel');
toggle('lights', on => panel.classList.toggle('open', on));

function syncPanel() {
  document.querySelectorAll('[data-light]').forEach(b =>
    b.setAttribute('aria-pressed', lightOn[b.dataset.light]));
  document.querySelectorAll('[data-shade]').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.shade === shade));
}
document.getElementById('lightBtns').addEventListener('click', e => {
  const k = e.target.dataset && e.target.dataset.light;
  if (!k) return;
  lightOn[k] = !lightOn[k];
  updateLights(); syncPanel(); invalidate();
});
document.getElementById('bright').addEventListener('input', e => {
  brightness = parseFloat(e.target.value);
  updateLights(); invalidate();
});
document.getElementById('shadeBtns').addEventListener('click', e => {
  const k = e.target.dataset && e.target.dataset.shade;
  if (!k) return;
  shade = k; applyLook(); syncPanel();
});
document.getElementById('bgBtns').addEventListener('click', e => {
  const k = e.target.dataset && e.target.dataset.bg;
  if (!k) return;
  scene.background = new THREE.Color(BGS[k]);
  invalidate();
  document.querySelectorAll('[data-bg]').forEach(b => b.setAttribute('aria-pressed', b.dataset.bg === k));
});
document.getElementById('perfBtns').addEventListener('click', e => {
  const k = e.target.dataset && e.target.dataset.opt;
  if (!k) return;
  if (k === 'twoSided') twoSided = !twoSided; else wireMoving = !wireMoving;
  e.target.setAttribute('aria-pressed', k === 'twoSided' ? twoSided : wireMoving);
  applyLook();
});
document.querySelectorAll('[data-opt]').forEach(b => b.setAttribute('aria-pressed', 'false'));
document.querySelector('[data-bg="dark"]').setAttribute('aria-pressed', 'true');
syncPanel();
</script>
</body>
</html>
